<title>CAFlow India</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail + sticky top bar + scrolling work area. Ledger-like density, navy ink on cool paper. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f0f3f7; --surface-3:#e8edf3; --line:#dde3eb; --line-2:#c9d2de;
  --fg:#13203a; --fg-2:#334160; --muted:#64708a; --faint:#8d97ab;
  --accent:#2350b8; --accent-2:#1b3f94; --accent-soft:#e7edfa; --accent-ink:#ffffff;
  --ok:#17784a; --ok-soft:#e3f3ea; --warn:#9a5a06; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe7e5; --info:#5a4bb5; --info-soft:#eeebfb;
  --side:#0f1a30; --side-fg:#c6cfdf; --side-muted:#7f8ba3; --side-active:#1d2b4a;
  --shadow:0 1px 2px rgba(19,32,58,.06),0 6px 24px rgba(19,32,58,.08);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#151b26; --surface-2:#1a2130; --surface-3:#212a3b; --line:#273144; --line-2:#344058;
  --fg:#e5eaf3; --fg-2:#c3cbda; --muted:#93a0b6; --faint:#6e7a90;
  --accent:#7aa2ff; --accent-2:#a3bfff; --accent-soft:#1d2a47; --accent-ink:#0d121b;
  --ok:#5cc98f; --ok-soft:#14301f; --warn:#e7aa4c; --warn-soft:#33260f; --bad:#f28b82; --bad-soft:#3a1a19; --info:#b2a6ff; --info-soft:#261f45;
  --side:#0a0e16; --side-fg:#c6cfdf; --side-muted:#6f7b92; --side-active:#18213a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#151b26; --surface-2:#1a2130; --surface-3:#212a3b; --line:#273144; --line-2:#344058;
  --fg:#e5eaf3; --fg-2:#c3cbda; --muted:#93a0b6; --faint:#6e7a90;
  --accent:#7aa2ff; --accent-2:#a3bfff; --accent-soft:#1d2a47; --accent-ink:#0d121b;
  --ok:#5cc98f; --ok-soft:#14301f; --warn:#e7aa4c; --warn-soft:#33260f; --bad:#f28b82; --bad-soft:#3a1a19; --info:#b2a6ff; --info-soft:#261f45;
  --side:#0a0e16; --side-fg:#c6cfdf; --side-muted:#6f7b92; --side-active:#18213a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .tiny{font-size:11px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;height:100%;overflow-y:auto;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand-mark{width:28px;height:28px;border-radius:6px;background:#2f63d6;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;font-family:var(--f-mono)}
.brand-name{font-weight:600;color:#fff;letter-spacing:.01em}
.brand-sub{font-size:10.5px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--side-fg);padding:7px 10px;border-radius:5px;cursor:pointer;font-size:13px}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:var(--side-active);color:#fff;box-shadow:inset 2px 0 0 #6d9bff}
.nav svg{width:16px;height:16px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.1);color:#fff;font-size:10.5px;padding:0 6px;border-radius:9px;font-family:var(--f-mono)}
.nav .badge.red{background:#b3261e}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--side-muted)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .search{flex:1 1 220px;max-width:420px;position:relative}
.top .search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.top .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.top-sp{flex:1}
.iconbtn{position:relative;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;color:var(--fg-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px}
.dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-mono);padding:0 4px}
.menu-toggle{display:none}
.content{flex:1;overflow:auto;padding:20px 22px 40px}
.demo-strip{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:5px 20px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-strip b{font-weight:600}

/* Page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.005em;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.crumb button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.inp,select.inp,textarea.inp{padding:6px 9px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);min-width:0}
textarea.inp{width:100%;resize:vertical;min-height:70px}
.inp.err{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:11.5px;margin-top:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{font-size:12.5px;padding:5px 8px}
.filters .q{flex:1 1 200px;max-width:280px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:4px}

/* Panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:13px;font-weight:600}
.card-b{padding:12px 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .12s,box-shadow .12s}
.kpi:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.kpi .k-l{font-size:11.5px;color:var(--muted)}
.kpi .k-v{font-size:22px;font-weight:600;font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k-s{font-size:11.5px;color:var(--faint)}
.kpi.bad .k-v{color:var(--bad)} .kpi.warn .k-v{color:var(--warn)}

/* Tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t td.r,.t th.r{text-align:right}
.t .strong{font-weight:500}
.t .sub{font-size:11.5px;color:var(--muted)}

/* Status */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface-3);color:var(--fg-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.vio{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;padding:0 6px;border:1px solid var(--line-2);border-radius:4px;font-size:11px;color:var(--fg-2);white-space:nowrap;font-family:var(--f-mono)}
.risk{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.risk i{width:8px;height:8px;border-radius:2px;display:inline-block}
.risk.High i{background:var(--bad)} .risk.Medium i{background:var(--warn)} .risk.Low i{background:var(--ok)}
.bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;min-width:50px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.ok>span{background:var(--ok)} .bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)}
.av{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.who{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.due-od{color:var(--bad);font-weight:500} .due-soon{color:var(--warn);font-weight:500}

/* Notices / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:var(--r);font-size:12.5px;background:var(--accent-soft);color:var(--fg-2);border:1px solid transparent;margin-bottom:12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note svg{width:15px;height:15px;flex:none;margin-top:1px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface-2)}
.li .main-t{flex:1;min-width:0}
.li .ttl{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.datebox{width:42px;flex:none;text-align:center;border:1px solid var(--line);border-radius:5px;padding:2px 0;line-height:1.15}
.datebox .m{font-size:9.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.datebox .d{font-family:var(--f-mono);font-weight:600;font-size:15px}
.datebox.od{border-color:var(--bad);color:var(--bad)}

/* Kanban */
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 232px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol-h{padding:8px 10px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.kcol-b{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:60px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px;cursor:grab;font-size:12px;display:flex;flex-direction:column;gap:5px}
.kcard:hover{border-color:var(--accent)}
.kcard.od{border-left:3px solid var(--bad)}
.kcard .kt{font-weight:500;font-size:12.5px;line-height:1.3}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-size:11px;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);text-transform:uppercase;letter-spacing:.06em}
.cal .dc{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.cal .dc.out{background:var(--surface-2)} .cal .dc.out .dn{color:var(--faint)}
.cal .dc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-2)}
.ev{font-size:11px;padding:2px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:left;width:100%}
.ev.ok{background:var(--ok-soft);color:var(--ok)} .ev.bad{background:var(--bad-soft);color:var(--bad)} .ev.warn{background:var(--warn-soft);color:var(--warn)}
.ev.more{background:none;color:var(--muted)}

/* Stepper */
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0 2px}
.step{flex:1 0 108px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:11.5px;color:var(--muted);text-align:center}
.step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line-2);z-index:0}
.step:first-child::before{display:none}
.step .c{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);z-index:1}
.step.done{color:var(--fg-2)} .step.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done::before,.step.cur::before{background:var(--ok)}
.step.cur{color:var(--fg);font-weight:600} .step.cur .c{border-color:var(--accent);color:var(--accent)}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.42);z-index:40;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:flex-start;padding:6vh 16px}
.drawer{width:min(620px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.modal{width:min(620px,100%);max-height:88vh;background:var(--surface);border-radius:10px;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.dh2{display:flex;align-items:flex-start;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh2 h2{margin:0;font-size:15.5px;font-weight:600;flex:1;text-wrap:balance}
.db{padding:16px 18px;overflow-y:auto;flex:1}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;color:var(--fg-2);margin-bottom:4px;font-weight:500}
.fld label .req{color:var(--bad)}
.fld .inp{width:100%}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:12.8px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sec{margin-bottom:18px}
.sec h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.cl{display:flex;flex-direction:column;gap:2px}
.cl label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer}
.cl label:hover{background:var(--surface-2)}
.cl input{accent-color:var(--ok)}
.cl .done{color:var(--muted);text-decoration:line-through}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .te{padding:0 0 10px 14px;position:relative;font-size:12.5px}
.tl .te::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl .te .w{color:var(--muted);font-size:11.5px}
.cmt{background:var(--surface-2);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:6px}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:7px;font-size:12.5px;box-shadow:var(--shadow);animation:slide .2s ease-out;display:flex;gap:8px}
.toast b{font-weight:600}
.pop{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;min-width:240px;padding:6px}
.pop button.mi{display:flex;width:100%;text-align:left;gap:8px;background:none;border:0;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:13px;align-items:center}
.pop button.mi:hover{background:var(--surface-2)}
.pop button.mi.on{color:var(--accent);font-weight:600}
.pop .ph2{font-size:11px;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.07em}
.rel{position:relative}
.switch{position:relative;width:34px;height:19px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:10px;cursor:pointer;transition:.15s}
.switch span::after{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(15px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.dz{border:1.5px dashed var(--line-2);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px}
.code{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre;overflow:auto;max-height:300px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--f-ui)}
svg.chart .grid line{stroke:var(--line)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-3)}
.stack span{display:block;height:100%}
.spin{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:4px;height:12px}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-dash,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu-toggle{display:grid}
  .g2{grid-template-columns:minmax(0,1fr)}
  .content{padding:16px}
  .top{padding:8px 16px}
  .fg{grid-template-columns:minmax(0,1fr)}
  .hide-sm{display:none!important}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kv{grid-template-columns:110px minmax(0,1fr)}.cal .dc{min-height:70px}.ev{font-size:10px}}

function rngFor(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const iso = d => { const z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s, n) => iso(new Date(pd(s).getTime() + n*DAY));
const dDiff = s => Math.round((pd(s) - TODAY) / DAY);

];

/* Task templates. All due dates are illustrative demo dates, not verified statutory deadlines. */
const TPL = {

function templatesFor(c){
  const gst = !!c.gstin, t = c.type;
  if (t==='Private Limited'||t==='Public Limited') return [gst&&'GSTR1_SEP',gst&&'GSTR3B_SEP','TDS_Q2','TDS24_Q2','AUDIT','ITR6','AOC4','MGT7'].filter(Boolean);
  if (t==='LLP') return [gst&&'GSTR1_SEP',gst&&'GSTR3B_SEP','TDS_Q2','ITR5','LLP8'].filter(Boolean);
  if (t==='Partnership') return [gst&&'GSTR1_SEP','GSTR3B_SEP','AUDIT','ITR5'].filter(x=>x&&(x!=='GSTR3B_SEP'||gst));
  if (t==='Proprietorship') return [gst&&'GSTR1_SEP',gst&&'GSTR3B_SEP',gst&&'GSTR1_OCT','ITR3'].filter(Boolean);
  if (t==='Individual') return ['ITR3','ADV_Q3'];
  if (t==='HUF') return ['ITR3','ADV_Q3'];
  if (t==='Trust') return ['ITR7','TDS_Q2'];
  return ['ITR3'];
}
const PAN4 = {'Private Limited':'C','Public Limited':'C','LLP':'F','Partnership':'F','Proprietorship':'P','Individual':'P','HUF':'H','Trust':'T'};
const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';

function buildFirm(cfg){
  const R = rngFor(cfg.seed), pick = a => a[Math.floor(R()*a.length)], ri = (a,b) => a + Math.floor(R()*(b-a+1));
  const staff = cfg.staff.map(([name,role],i) => ({ id:cfg.id+'-u'+i, name, role, email:name.toLowerCase().replace(/[^a-z]+/g,'.')+'@'+cfg.short.toLowerCase()+'.example.in', capacity: role.includes('Partner')?14:role==='Manager'?18:role==='Article Assistant'?10:16, active:true }));
  const partners = staff.filter(s=>s.role.includes('Partner')), mgr = staff.find(s=>s.role==='Manager');
  const preparers = staff.filter(s=>/Accountant|Article/.test(s.role));
  const reviewers = [mgr, ...partners];
  const clients = cfg.clients.map(([name,type,st],i) => {
    const pan = L[ri(0,23)]+L[ri(0,23)]+L[ri(0,23)]+PAN4[type]+name.replace(/^(Dr\.|Mr\.|Mrs\.)\s*/,'')[0].toUpperCase()+ri(1000,9999)+L[ri(0,23)];
    const gstReg = !['Individual','HUF'].includes(type) && !(type==='Trust' && i%2===0);
    const contactFirst = ['Suresh','Lakshmi','Farhan','Geeta','Naveen','Shalini','Rahul','Anita','Prakash','Divya','Imtiaz','Sneha','Gaurav','Rekha'][i%14];
    return { id:cfg.id+'-c'+i, name, type, state:st, pan, gstin: gstReg ? st+pan+'1Z'+L[ri(0,23)] : '', tan: /Limited|LLP|Trust/.test(type) ? 'BLR'+L[ri(0,23)]+ri(10000,99999)+L[ri(0,23)] : '',
      partner: partners[i%partners.length].id, pkg: type==='Public Limited'?'Enterprise': /Private|LLP/.test(type)? pick(['Growth','Enterprise','Growth']) : pick(['Essential','Essential','Custom']),
      status: i===13?'Onboarding':'Active', contact: /^(Dr\.|Mr\.|Mrs\.)/.test(name)? name : contactFirst+' '+name.split(' ')[0],
      email: 'accounts@'+name.toLowerCase().replace(/[^a-z]+/g,'').slice(0,14)+'.example.in', phone:'+91 90000 '+String(10000+i*731+cfg.seed).slice(-5),
      services: [], since: String(2016+ri(0,9)) };
  });
  const tasks = []; let tn = 1;
  clients.forEach((c,ci) => {
    const tpls = templatesFor(c);
    c.services = [...new Set(tpls.map(k=>TPL[k].cat))];
    if (ci%3===0) c.services.push('Bookkeeping');
    const take = c.status==='Onboarding' ? tpls.slice(0,1) : tpls.filter((k,j)=> j<2 || R()<0.62);
    take.forEach(k => {
      const T = TPL[k]; const dd = dDiff(T.due); let st;
      const r = R();
      if (dd < 0) st = r<0.45?'Completed': r<0.6?'Evidence Pending': r<0.68?'Filed': r<0.8?'In Progress': r<0.9?'Changes Requested':'Under Review';
      else if (dd <= 8) st = r<0.12?'Documents Requested': r<0.3?'In Progress': r<0.45?'Prepared': r<0.6?'Under Review': r<0.68?'Changes Requested': r<0.78?'Approved': r<0.88?'Ready to File': 'Filed';
      else if (dd <= 25) st = r<0.25?'Scheduled': r<0.6?'Documents Requested': r<0.85?'In Progress':'Prepared';
      else st = r<0.6?'Scheduled':'Documents Requested';
      const si = STATUSES.indexOf(st), prog = si/10;
      const preparer = preparers[(ci+tn)%preparers.length].id, reviewer = reviewers[(ci+tn)%reviewers.length].id;
      const done = Math.min(T.cl.length, Math.round(T.cl.length*Math.min(1,prog*1.15)));
      const internal = addD(T.due, -T.lead);
      const prio = dd < 0 && si<8 ? 'Critical' : dd<=5 && si<7 ? 'High' : R()<0.3 ? 'High' : R()<0.5 ? 'Medium':'Low';
      const blocked = (st==='Documents Requested' && R()<0.35) ? 'Waiting on client: '+T.docs[0] : '';
      const method = ['GST','TDS/TCS'].includes(T.cat) && R()<0.4 ? 'Integrated' : 'Assisted';
      const filedOn = si>=8 ? addD(T.due, -ri(0,3)) : '';
      const ack = si>=8 ? (T.cat==='GST'?'AA'+c.state+'0926'+ri(100000,999999)+'X': T.cat==='MCA/ROC'?'SRN-F'+ri(1000000,9999999): 'ACK-'+ri(100000000,999999999)+ ' ') : '';
      const t = { id:cfg.id+'-t'+tn, no:'T-'+String(1000+tn), tpl:k, title:T.form+' — '+T.period, form:T.form, cat:T.cat, period:T.period, fy:T.fy, clientId:c.id,
        preparer, reviewer, due:T.due, internal, priority:prio, status:st, blocked,
        docs:[...T.docs], checklist:T.cl.map((x,i)=>({t:x,done:i<done})), comments:[], activity:[],
        filing:{ method, provider: method==='Integrated' ? (T.cat==='GST'?'GSP Connect (sandbox)':'TDS Gateway (sandbox)') : '', validation: method==='Integrated' && si>=7 ? 'Passed (sandbox)' : '',
          submittedOn: filedOn, ack: ack.trim(), evidence: si>=10 ? 'Verified' : si===9 ? (R()<0.5?'Awaiting upload':'Under verification') : si===8 ? 'Awaiting upload' : 'Not yet due', evidenceFile: si>=10||(si===9&&R()<0.5)?'acknowledgement_'+T.form.replace(/\W/g,'')+'.pdf':'' } };
      const actors = [preparer, reviewer];
      const created = addD(T.due, -ri(24,40));
      t.activity.push({at:created, by:'system', text:'Task generated by rule "'+(T.cat==='GST'?'Monthly GST task generation':'Annual compliance calendar')+'"'});
      if (si>=1) t.activity.push({at:addD(created,2), by:'system', text:'Document request queued for '+c.contact});
      if (si>=2) t.activity.push({at:addD(created,ri(5,9)), by:preparer, text:'Moved to In Progress'});
      if (si>=4) t.activity.push({at:addD(internal,-1), by:preparer, text:'Submitted for review'});
      if (st==='Changes Requested') { t.activity.push({at:addD(internal,0), by:reviewer, text:'Requested changes'}); t.comments.push({at:addD(internal,0), by:reviewer, text:'ITC on two invoices does not match GSTR-2B. Please reconcile before resubmitting.'}); }
      if (si>=6) t.activity.push({at:addD(internal,1), by:reviewer, text:'Approved for filing'});
      if (si>=8) t.activity.push({at:filedOn, by:preparer, text:'Submission recorded ('+method.toLowerCase()+' filing), ack '+t.filing.ack});
      if (si>=10) t.activity.push({at:addD(filedOn,1), by:reviewer, text:'Acknowledgement evidence verified'});
      if (blocked) t.comments.push({at:addD(created,6), by:preparer, text:'Client has not shared '+T.docs[0].toLowerCase()+'. Followed up on WhatsApp.'});
      t.activity = t.activity.filter(a=>a.at<=TODAY_S).sort((a,b)=>a.at<b.at?1:-1);
      tasks.push(t); tn++;
    });
  });
  // Documents derived from tasks
  const docs = []; let dn = 1;
  tasks.forEach(t => {
    const si = STATUSES.indexOf(t.status);
    t.docs.forEach((d,i) => {
      let st, comment='';
      const req = t.activity.length ? t.activity[t.activity.length-1].at : addD(t.internal,-14);
      if (si===0) return;
      if (si===1) st = t.blocked && i===0 ? 'Missing' : (R()<0.5?'Requested':'Received');
      else if (si<=3) st = R()<0.25 ? 'Awaiting Review' : R()<0.15 ? 'Rejected' : 'Received';
      else st = 'Received';
      if (st==='Rejected') comment = 'Statement is password-protected and partially illegible. Please re-upload.';
      if (st==='Missing') comment = 'Requested twice; no response.';
      docs.push({ id:cfg.id+'-d'+dn++, clientId:t.clientId, taskId:t.id, name:d, fy:t.fy, status:st, requestedOn:addD(req,1), uploadedOn: ['Received','Awaiting Review','Rejected'].includes(st)? addD(req, ri(2,8)) : '', comment, file: ['Received','Awaiting Review','Rejected'].includes(st) ? d.toLowerCase().replace(/[^a-z0-9]+/g,'_')+(R()<0.5?'.pdf':'.xlsx'):'' , by: st==='Received'||st==='Rejected' ? t.reviewer : '' });
    });
  });
  docs.forEach(d=>{ if (d.uploadedOn > TODAY_S) d.uploadedOn = TODAY_S; if (d.requestedOn > TODAY_S) d.requestedOn = addD(TODAY_S,-3); });
  // Outbox / notifications
  const msgs = []; let mn = 1;
  const odTasks = tasks.filter(t=>isOverdue(t));
  const reviewTasks = tasks.filter(t=>t.status==='Under Review');
  const reqDocs = docs.filter(d=>['Requested','Missing'].includes(d.status));
  reqDocs.slice(0,6).forEach((d,i) => { const c = clients.find(x=>x.id===d.clientId);
    msgs.push({id:cfg.id+'-m'+mn++, channel: i%2?'WhatsApp':'Email', to:c.contact, toAddr: i%2?c.phone:c.email, clientId:c.id, purpose:'Document request', template:'doc_request', scheduled: addD(TODAY_S, i<3?-i:1)+' 10:00', status: i<3 ? (i===2&&i%2===0?'Failed (demo)':'Simulated') : 'Scheduled', retry: i===2?'Retry 1 of 3 queued':'—', read:true,
      body:'Dear '+c.contact+',\n\nTo complete '+(tasks.find(t=>t.id===d.taskId)||{}).title+', please share: '+d.name+'.\n\nYou can upload it through the CAFlow client portal.\n\nRegards,\n'+cfg.name }); });
  odTasks.slice(0,4).forEach(t => { const c = clients.find(x=>x.id===t.clientId); msgs.push({id:cfg.id+'-m'+mn++, channel:'In-app', to:staffName(staff,t.preparer), clientId:c.id, purpose:'Overdue escalation', template:'deadline', scheduled:TODAY_S+' 08:00', status:'Simulated', retry:'—', read:false, taskId:t.id, body:t.title+' for '+c.name+' is past its internal due date ('+fmtD(t.internal)+'). Escalated to '+staffName(staff,t.reviewer)+'.'}); });
  reviewTasks.slice(0,3).forEach(t => { const c = clients.find(x=>x.id===t.clientId); msgs.push({id:cfg.id+'-m'+mn++, channel:'In-app', to:staffName(staff,t.reviewer), clientId:c.id, purpose:'Review request', template:'approval', scheduled:addD(TODAY_S,-1)+' 16:20', status:'Simulated', retry:'—', read: false, taskId:t.id, body:staffName(staff,t.preparer)+' submitted '+t.title+' ('+c.name+') for review.'}); });

/* Form helper: reads [name] fields inside a container, validates [data-req] */
function readForm(root){ const o = {}; let ok = true; root.querySelectorAll('[name]').forEach(el => {
    if (el.type==='checkbox') { if (el.dataset.multi) { o[el.name] = o[el.name] || []; if (el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; return; }
    o[el.name] = el.value.trim(); });
  root.querySelectorAll('.ferr').forEach(e=>e.remove()); root.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));
  root.querySelectorAll('[data-req]').forEach(el => { const v = el.value.trim(); let msg = '';
    if (!v) msg = 'Required.'; else if (el.dataset.pattern && !new RegExp(el.dataset.pattern).test(v)) msg = el.dataset.msg || 'Invalid format.';
    if (msg) { ok = false; el.classList.add('err'); el.insertAdjacentHTML('afterend', `<div class="ferr">${h(msg)}</div>`); } });
  root.querySelectorAll('[data-reqgroup]').forEach(g => { if (!g.querySelector('input:checked')) { ok = false; g.insertAdjacentHTML('afterend', `<div class="ferr">Select at least one.</div>`); } });
  if (!ok) { const e = root.querySelector('.err'); if (e) e.focus(); }
  return ok ? o : null; }
const fld = (label, inner, req, full) => `<div class="fld ${full?'full':''}"><label>${h(label)}${req?' <span class="req">*</span>':''}</label>${inner}</div>`;

/* ===== Charts (SVG, single scale) ===== */
function niceMax(v){ if (v<=5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=2?2:n<=5?5:10)*p; }
function barChart(labels, series, opts={}){
  const W = 560, H = opts.h || 200, pl = 34, pr = 8, pt = 10, pb = 24; const stacked = !!opts.stacked;
  const totals = labels.map((_,i) => stacked ? series.reduce((a,s)=>a+s.values[i],0) : Math.max(...series.map(s=>s.values[i])));
  const mx = niceMax(Math.max(1, ...totals)); const cw = (W-pl-pr)/labels.length; const bw = stacked ? Math.min(34, cw*0.55) : Math.min(16, cw*0.7/series.length);
  const y = v => pt + (H-pt-pb) * (1 - v/mx);
  let g = '<g class="grid">'; for (let k=0;k<=4;k++){ const v = mx*k/4; g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end">${opts.fmt?opts.fmt(v):Math.round(v)}</text>`; } g += '</g>';
  let b = ''; labels.forEach((l,i) => { const cx = pl + cw*i + cw/2; let acc = 0;
    series.forEach((s,j) => { const v = s.values[i]; if (stacked) { const y0 = y(acc), y1 = y(acc+v); if (v>0) b += `<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" fill="${s.color}" rx="1.5"><title>${h(l)} · ${h(s.name)}: ${v}</title></rect>`; acc += v; }
      else { const x = cx - (series.length*bw)/2 + j*bw; b += `<rect x="${x+1}" y="${y(v)}" width="${bw-2}" height="${Math.max(0,y(0)-y(v))}" fill="${s.color}" rx="1.5"><title>${h(l)} · ${h(s.name)}: ${opts.fmt?opts.fmt(v):v}</title></rect>`; } });
    b += `<text x="${cx}" y="${H-7}" text-anchor="middle">${h(l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${h(opts.label||'Bar chart')}">${g}${b}</svg>` +
    `<div class="legend" style="margin-top:6px">${series.map(s=>`<span><i style="background:${s.color}"></i>${h(s.name)}</span>`).join('')}</div>`;
}
const C = { a:'var(--accent)', ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)', vio:'var(--info)', mute:'var(--line-2)' };
function hbars(items){ const mx = Math.max(1, ...items.map(i=>i.max ?? i.value));
  return `<div class="list">${items.map(i => { const pct = Math.round(100*i.value/(i.max ?? mx)); return `<div style="display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(i.label)}</span><div class="bar ${i.cls||''}"><span style="width:${Math.min(100,pct)}%"></span></div><span class="num" style="text-align:right">${i.text ?? i.value}</span></div>`; }).join('')}</div>`; }

/* Historical monthly series (Apr–Sep): seeded demo summary per firm */
function monthHist(){ const d = D(); if (d.hist) return d.hist; const R = rngFor(d.cfg.seed*7);
  d.hist = ['Apr','May','Jun','Jul','Aug','Sep'].map(m => { const due = 30 + Math.floor(R()*16); const late = Math.floor(R()*4); return {m, due, onTime: due - late - (m==='Sep'?0:0), late}; }); return d.hist; }

ACT.saveclient = () => {
  const root = document.getElementById('fclient'); root.querySelectorAll('input.mono').forEach(i=>i.value=i.value.toUpperCase());
  const o = readForm(root); if (!o) return toast('Fix the highlighted fields to save.', 'warn');
  const errAt = (id, msg) => { const el = document.getElementById(id); el.classList.add('err'); el.insertAdjacentHTML('afterend', `<div class="ferr">${h(msg)}</div>`); el.focus(); toast('Fix the highlighted fields to save.', 'warn'); };
  if (o.tan && !/^[A-Z]{4}[0-9]{5}[A-Z]$/.test(o.tan)) return errAt('ac-tan', 'TAN format is 4 letters, 5 digits, 1 letter.');
  if (o.gstreg==='yes' && !/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(o.gstin)) return errAt('ac-gstin', 'Enter a 15-character GSTIN, or set registration to Not registered.');
  if (o.gstreg==='yes' && o.gstin.slice(2,12) !== o.pan) return errAt('ac-gstin', 'Characters 3–12 of the GSTIN must match the PAN.');
  if (D().clients.some(c=>c.pan===o.pan)) return errAt('ac-pan', 'A client with this PAN already exists in this firm.');
  const d = D(); const id = d.cfg.id+'-c'+(d.seq.c++);
  const c = { id, name:o.name, type:o.type, state:o.state, pan:o.pan, tan:o.tan, gstin:o.gstreg==='yes'?o.gstin:'', partner:o.partner, pkg:o.pkg, status:'Onboarding', contact:o.contact, email:o.email, phone:o.phone, services:o.services, since:'2026' };
  d.clients.unshift(c); let n = 0;
  if (o.gen) templatesFor(c).filter(k => o.services.includes(TPL[k].cat)).forEach(k => { createTaskFromTpl(c, k); n++; });
  closeModal(); S.f.clients = {}; go('client', {id});
  toast(`<b>${h(c.name)}</b> added as Onboarding.${o.gen?` ${n} demo task(s) generated.`:''} Saved in this browser tab only.`);
};
function createTaskFromTpl(c, k, over={}){
  const d = D(), T = TPL[k]; const preps = d.staff.filter(s=>/Accountant/.test(s.role)); const n = d.seq.t++;
  const t = Object.assign({ id:d.cfg.id+'-t'+n, no:'T-'+(1000+n), tpl:k, title:T.form+' — '+T.period, form:T.form, cat:T.cat, period:T.period, fy:T.fy, clientId:c.id,
    preparer:preps[n%preps.length].id, reviewer:d.staff.find(s=>s.role==='Manager').id, due:T.due, internal:addD(T.due,-T.lead), priority:dDiff(T.due)<7?'High':'Medium', status:'Scheduled', blocked:'',
    docs:[...T.docs], checklist:T.cl.map(x=>({t:x,done:false})), comments:[], activity:[], filing:{method:'Assisted', provider:'', validation:'', submittedOn:'', ack:'', evidence:'Not yet due', evidenceFile:''} }, over);
  t.activity.push({at:TODAY_S, by: me()?me().id:'system', text: over.manual ? 'Task created manually' : 'Task generated from client services (simulated rule run)'});
  delete t.manual; d.tasks.push(t); return t; }

PAGES.calendar = () => {
  const f = F('calendar', {month:'2026-10', view:'month', client:'', cat:'', status:'', basis:'due'});
  const [Y, M] = f.month.split('-').map(Number);
  let ts = vTasks().filter(t => (!f.client||t.clientId===f.client) && (!f.cat||t.cat===f.cat) && (!f.status || (f.status==='open'?isOpen(t): f.status==='overdue'? isOverdue(t) : f.status==='done' ? !isOpen(t) : t.status===f.status)));
  const inMonth = ts.filter(t => t[f.basis].startsWith(f.month));
  const months = []; for (let i=-4;i<=4;i++){ const d = new Date(2026, 9+i, 1); months.push([iso(d).slice(0,7), MON[d.getMonth()]+' '+d.getFullYear()]); }
  const ctrl = `<div class="filters">
    <div class="seg" role="tablist"><button class="${f.view==='month'?'on':''}" data-act="calview" data-v="month">Month</button><button class="${f.view==='agenda'?'on':''}" data-act="calview" data-v="agenda">Agenda</button></div>
    <button class="btn sm" data-act="calnav" data-d="-1" aria-label="Previous month">‹</button><select class="inp" id="cal-m" data-f="calendar.month" aria-label="Month">${opt(months, f.month)}</select><button class="btn sm" data-act="calnav" data-d="1" aria-label="Next month">›</button>
    <select class="inp" id="cal-basis" data-f="calendar.basis" aria-label="Date basis">${opt([['due','Statutory due dates'],['internal','Internal due dates']], f.basis)}</select>
    ${S.role!=='client'?`<select class="inp" id="cal-client" data-f="calendar.client" aria-label="Client">${clientOpts(f.client,'All clients')}</select>`:''}
    <select class="inp" id="cal-cat" data-f="calendar.cat" aria-label="Compliance type">${opt(CATS, f.cat, 'All compliance types')}</select>
    <select class="inp" id="cal-status" data-f="calendar.status" aria-label="Status">${opt([['open','Open'],['overdue','Overdue'],['done','Filed or completed'],...STATUSES.map(s=>[s,s])], f.status, 'All statuses')}</select>
  </div>`;
  const legend = `<div class="legend" style="margin:8px 0 0"><span><i style="background:var(--accent)"></i>Open</span><span><i style="background:var(--warn)"></i>High risk</span><span><i style="background:var(--bad)"></i>Past statutory demo date</span><span><i style="background:var(--ok)"></i>Filed / completed</span></div>`;
  let body;
  if (f.view==='month') {
    const first = new Date(Y, M-1, 1); const start = new Date(first.getTime() - ((first.getDay()+6)%7)*DAY);
    let cells = ''; for (let i=0;i<42;i++){ const d = new Date(start.getTime()+i*DAY); const s = iso(d); const evs = ts.filter(t=>t[f.basis]===s); const out = d.getMonth() !== M-1;
      if (i>=35 && out && d.getDate()<8 && i%7===0) break;
      cells += `<div class="dc ${out?'out':''} ${s===TODAY_S?'today':''}"><span class="dn">${d.getDate()}</span>${evs.slice(0,3).map(t=>`<button class="ev ${evCls(t)}" data-act="opentask" data-id="${t.id}" title="${h(t.form+' · '+clientById(t.clientId).name)}">${h(t.form)} · ${h(clientById(t.clientId).name.split(' ')[0])}</button>`).join('')}${evs.length>3?`<button class="ev more" data-act="calday" data-d="${s}">+${evs.length-3} more</button>`:''}</div>`; }
    body = `<div class="card"><div class="tw"><div class="cal" style="min-width:640px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells}</div></div></div>${legend}`;
  } else {
    const days = [...new Set(inMonth.map(t=>t[f.basis]))].sort();
    body = days.length ? `<div class="card"><div class="tw"><table class="t"><thead><tr><th>Date</th><th>Client</th><th>Compliance</th><th>Period</th><th>Statutory due <span class="faint">(demo)</span></th><th>Internal due</th><th>Responsible</th><th>Review status</th><th>Risk</th></tr></thead><tbody>
      ${days.map(dd => inMonth.filter(t=>t[f.basis]===dd).map((t,i)=>`<tr class="click" data-act="opentask" data-id="${t.id}"><td class="num">${i===0?`<b>${fmtDs(dd)}</b> <span class="tiny muted">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][pd(dd).getDay()]}</span>`:''}</td><td>${h(clientById(t.clientId).name)}</td><td><span class="tag">${h(t.form)}</span> <span class="tiny muted">${h(t.cat)}</span></td><td class="num">${h(t.period)}</td><td>${dueCell(t.due,t)}</td><td>${dueCell(t.internal,t)}</td><td>${who(t.preparer)}</td><td>${pill(reviewStatus(t), reviewStatus(t)==='Approved'?'ok':reviewStatus(t)==='Changes requested'?'bad':reviewStatus(t)==='In review'?'warn':'')}</td><td>${risk(riskOf(t))}</td></tr>`).join('')).join('')}
    </tbody></table></div></div>` : `<div class="card">${empty('Nothing scheduled','No obligations match these filters in '+months.find(m=>m[0]===f.month)[1]+'.')}</div>`;
  }
  return `<div class="ph"><div><h1>Compliance calendar</h1><div class="sub">${inMonth.length} obligations in ${months.find(m=>m[0]===f.month)[1]} by ${f.basis==='due'?'statutory':'internal'} date</div></div></div>
  <div class="note warn">${I('alert')}<div>All due dates are fictional demo dates for this prototype. They are not verified statutory deadlines; production dates come from the approved Compliance Rules catalogue.</div></div>${ctrl}${body}`;
};

/* ===== Task status engine ===== */
function setStatus(t, s, note){
  const from = t.status, si = STATUSES.indexOf(s);
  if (si >= 8 && !t.filing.ack) { toast('Record the submission and acknowledgement in the filing panel before marking this filed.', 'warn'); openDrawer('filing', t.id); return false; }
  if (s==='Completed' && t.filing.evidence !== 'Verified') { toast('Verify the acknowledgement evidence before completing.', 'warn'); openDrawer('filing', t.id); return false; }
  t.status = s; logActivity(t, `Status changed from ${from} to ${s}${note?': '+note:''}`);
  if (s==='Prepared' && D().rules.find(r=>r.id==='r5').enabled) {
    t.status = 'Under Review'; logActivity(t, 'Moved to Under Review by rule "Reviewer handoff" (simulated)', 'system');
    pushInApp(t.reviewer, t, 'Review request', `${sname(t.preparer)} submitted ${t.title} (${clientById(t.clientId).name}) for review.`);
    toast(`Rule “Reviewer handoff” moved ${t.no} to Under Review and alerted ${h(sname(t.reviewer))} (simulated).`, 'sim');
  }
  if (s==='Changes Requested') pushInApp(t.preparer, t, 'Changes requested', `${sname(t.reviewer)} requested changes on ${t.title}.`);
  if (s==='Approved') pushInApp(t.preparer, t, 'Approved', `${t.title} approved for filing.`);
  if (si >= 2 && t.blocked) { t.blocked = ''; }
  return true;
}
function pushInApp(toId, t, purpose, body){ const d = D(); d.msgs.unshift({id:d.cfg.id+'-m'+(d.seq.m++), channel:'In-app', to:sname(toId), clientId:t.clientId, purpose, template:'inapp', scheduled:TODAY_S+' '+new Date().toTimeString().slice(0,5), status:'Simulated', retry:'—', read:false, taskId:t.id, body}); }

    ${anyF?`<button class="btn sm ghost" data-act="clearft">Clear filters</button>`:''}<span class="tiny muted">${ts.length} shown</span>

function filteredTasks(f){ const q = (f.q||'').toLowerCase();
  return vTasks().filter(t => (!q || (t.title+' '+t.no+' '+clientById(t.clientId).name+' '+t.cat).toLowerCase().includes(q))
    && (!f.user || t.preparer===f.user || t.reviewer===f.user) && (!f.client || t.clientId===f.client) && (!f.cat || t.cat===f.cat) && (!f.risk || (isOpen(t) && riskOf(t)===f.risk))
    && (!f.status || (f.status==='open' ? isOpen(t) : f.status==='blocked' ? !!t.blocked && isOpen(t) : t.status===f.status))
    && (!f.deadline || (f.deadline==='overdue' ? isOverdue(t) : f.deadline==='statod' ? isStatOverdue(t) : isOpen(t) && dDiff(t.due)>=0 && dDiff(t.due) <= (f.deadline==='week'?7:30)))); }

function kanban(ts){

AFTER.tasks = () => {

      <dt>Validation result</dt><dd>${t.filing.validation?pill(t.filing.validation):'<span class="muted">Not run</span>'}${t.filing.valErrors?`<div class="tiny" style="color:var(--bad)">${h(t.filing.valErrors)}</div>`:''}</dd><dt>Submission</dt><dd>${pill(subStatus(t))}</dd><dt>Provider reference</dt><dd class="mono">${h(t.filing.provRef||'—')}</dd></dl>
      <div class="row" style="margin-top:10px">${ed && pv.caps.some(x=>/Validation|validation/.test(x)) && stage>=3 && !t.filing.ack ? `<button class="btn" data-act="fvalidate" data-id="${t.id}">Run sandbox validation</button>`:''}
      <button class="btn" disabled title="Live submission unavailable">${I('send')}Submit via provider</button>${ed && !t.filing.ack ? `<button class="btn ghost" data-act="fmethod" data-id="${t.id}" data-m="Assisted">Switch to assisted filing</button>`:''}</div>
      <div class="tiny muted" style="margin-top:6px">Live submission is unavailable: the ${h(pv.name)} is ${h(pv.state.toLowerCase())}. ${h(pv.note)}</div>`;
  else methodBody = `<div class="sec" style="margin-bottom:12px"><div class="row"><b class="small">1. File on the official portal</b><a class="btn sm" href="${PORTALS[t.cat]}" target="_blank" rel="noopener noreferrer">${I('ext')}Open ${h(new URL(PORTALS[t.cat]).hostname)}</a></div><div class="tiny muted" style="margin-top:4px">An authorised person files and e-verifies on the portal. CAFlow does not see that session.</div></div>
    <div class="sec" style="margin-bottom:12px"><b class="small">2. Record submission</b>
      ${t.filing.ack ? `<dl class="kv" style="margin-top:6px"><dt>Submitted on</dt><dd>${fmtD(t.filing.submittedOn)}</dd><dt>Acknowledgement</dt><dd class="mono">${h(t.filing.ack)}</dd><dt>Recorded as</dt><dd class="tiny muted">User-entered. Not verified with the portal.</dd></dl>`
      : ready && ed ? `<form id="fsub" class="fg" style="margin-top:8px" novalidate>${fld('Submission date', `<input class="inp" type="date" name="date" id="fs-date" data-req max="${TODAY_S}" value="${TODAY_S}">`, true)}${fld('Acknowledgement / ARN / SRN', `<input class="inp mono" name="ack" id="fs-ack" data-req data-pattern="^[A-Za-z0-9-]{6,30}$" data-msg="6–30 letters, digits or hyphens." placeholder="As shown on the portal">`, true)}
        <label class="chk full"><input type="checkbox" name="confirm" id="fs-conf">I confirm this return was submitted on the official portal by an authorised person.</label></form><button class="btn pri" style="margin-top:8px" data-act="frecord" data-id="${t.id}">Record submission</button>`
      : `<div class="small muted" style="margin-top:4px">${ready?'Your role cannot record submissions.':'Available once the task is approved and marked Ready to File (currently '+h(t.status)+').'}</div>`}</div>
    <div class="sec" style="margin-bottom:0"><b class="small">3. Acknowledgement evidence</b>
      ${t.filing.evidenceFile?`<div class="row small" style="margin-top:6px">${I('file')}<span class="mono">${h(t.filing.evidenceFile)}</span>${pill(t.filing.evidence)}</div>`:''}
      ${t.filing.evRejected?`<div class="tiny" style="color:var(--bad);margin-top:4px">Rejected: ${h(t.filing.evRejected)}</div>`:''}
      <div class="row" style="margin-top:8px">
      ${t.filing.ack && ed && ['Awaiting upload','Uploaded, not submitted'].includes(t.filing.evidence) ? `<label class="btn" for="fs-file">${I('upload')}${t.filing.evidenceFile?'Replace file':'Upload acknowledgement'}</label><input type="file" id="fs-file" accept=".pdf,.png,.jpg,.jpeg" hidden data-act-change="fevfile" data-id="${t.id}">`:''}
      ${t.filing.evidence==='Uploaded, not submitted' && ed ? `<button class="btn pri" data-act="fevsubmit" data-id="${t.id}">Submit for evidence verification</button>`:''}
      ${t.filing.evidence==='Under verification' ? (verifier ? `<button class="btn danger" data-act="fevreject" data-id="${t.id}">Reject evidence</button><button class="btn pri" data-act="fevverify" data-id="${t.id}">${I('check')}Verify and complete</button>` : '<span class="small muted">Waiting for a partner to verify.</span>'):''}
      ${!t.filing.ack?'<span class="small muted">Upload opens after the submission is recorded.</span>':''}</div>
      <div class="tiny muted" style="margin-top:6px">Files stay in this browser tab (simulated storage). Verification means a partner compared the file with the recorded acknowledgement.</div></div>`;
  return `<div class="dh2"><div style="flex:1;min-width:0"><div class="tiny muted"><span class="mono">${t.no}</span> · ${h(t.cat)} · Filing</div><h2>${h(t.form)} · ${h(t.period)}</h2><div class="small muted">${h(c.name)} · demo due ${fmtD(t.due)}</div></div><button class="iconbtn" data-act="closedrawer" aria-label="Close">${I('x')}</button></div>
  <div class="db">
    <div class="sec"><div class="steps">${steps.map((s,i)=>`<div class="step ${i<stage?'done':i===stage?'cur':''}"><span class="c">${i<stage?'✓':i+1}</span>${s}</div>`).join('')}</div></div>
    <div class="sec"><h4>Workflow</h4><dl class="kv"><dt>Task status</dt><dd>${pill(t.status)}</dd><dt>Preparation</dt><dd>${pill(prepStatus(t))} by ${h(sname(t.preparer))}</dd><dt>Review</dt><dd>${h(reviewStatus(t))} · ${h(sname(t.reviewer))}</dd><dt>Approval</dt><dd>${pill(apprStatus(t))}</dd></dl>
      ${S.role!=='client'?`<button class="btn sm" style="margin-top:8px" data-act="opentask" data-id="${t.id}">Open task details</button>`:''}</div>
    <div class="sec"><div class="row" style="margin-bottom:8px"><h4 style="margin:0" class="grow">Filing method</h4>${S.role!=='client'?`<div class="seg"><button class="${t.filing.method==='Integrated'?'on':''}" data-act="fmethod" data-id="${t.id}" data-m="Integrated" ${t.filing.ack||!ed?'disabled':''}>Integrated</button><button class="${t.filing.method==='Assisted'?'on':''}" data-act="fmethod" data-id="${t.id}" data-m="Assisted" ${t.filing.ack||!ed?'disabled':''}>Assisted</button></div>`:`<span class="tag">${h(t.filing.method)}</span>`}</div>
      <div class="card"><div class="card-b">${S.role==='client' ? `<dl class="kv"><dt>Submission</dt><dd>${pill(subStatus(t))}</dd><dt>Acknowledgement</dt><dd class="mono">${h(t.filing.ack||'—')}</dd><dt>Evidence</dt><dd>${pill(t.filing.evidence)}</dd></dl>` : methodBody}</div></div></div>
    <div class="sec"><h4>History</h4><div class="tl">${t.activity.filter(a=>/ubmi|ack|vidence|ilin|alidat|pprov/i.test(a.text)).map(a=>`<div class="te"><div>${h(a.text)}</div><div class="w">${h(sname(a.by))} · ${fmtD(a.at)}</div></div>`).join('') || '<div class="te"><div class="muted">No filing events yet.</div></div>'}</div></div>
  </div>`;
};
ACT.fmethod = el => { const t = taskById(el.dataset.id); if (t.filing.method===el.dataset.m) return; t.filing.method = el.dataset.m; t.filing.validation=''; t.filing.provRef=''; logActivity(t, 'Filing method set to '+el.dataset.m); render(); };
ACT.fvalidate = el => { const t = taskById(el.dataset.id); const b = el; b.disabled = true; b.innerHTML = '<span class="spin"></span> Validating in sandbox…';
  setTimeout(() => { const open = t.checklist.filter(x=>!x.done && !/sign-off/i.test(x.t)); if (open.length) { t.filing.validation = 'Failed (sandbox)'; t.filing.valErrors = 'Checklist incomplete: '+open.map(x=>x.t).join('; '); }
    else { t.filing.validation = 'Passed (sandbox)'; t.filing.valErrors = ''; t.filing.provRef = 'SBX-'+t.no+'-'+Math.floor(Math.random()*9000+1000); }
    logActivity(t, 'Sandbox validation '+(t.filing.validation.startsWith('Passed')?'passed':'failed')+' (no live submission)'); render(); toast('Sandbox validation finished. Nothing was submitted.', 'sim'); }, 900); };
ACT.frecord = el => { const root = document.getElementById('fsub'); const o = readForm(root); if (!o) return toast('Enter the submission date and acknowledgement.', 'warn');
  if (!o.confirm) return toast('Tick the confirmation to record this submission.', 'warn'); if (o.date > TODAY_S) return toast('Submission date cannot be in the future.', 'warn');
  const t = taskById(el.dataset.id); t.filing.submittedOn = o.date; t.filing.ack = o.ack.toUpperCase(); t.filing.evidence = 'Awaiting upload'; t.status = 'Filed';
  logActivity(t, `Submission recorded by user on ${fmtD(o.date)}, ack ${t.filing.ack} (assisted filing; not verified by CAFlow)`); render(); toast('Submission recorded. Upload the acknowledgement next.'); };
CHG.fevfile = el => { const file = el.files && el.files[0]; if (!file) return; const t = taskById(el.dataset.id);
  if (file.size > 10*1024*1024) return toast('That file is over 10 MB. Upload a smaller PDF or image.', 'warn');
  t.filing.evidenceFile = file.name; t.filing.evidence = 'Uploaded, not submitted'; t.filing.evRejected = ''; t.status = 'Evidence Pending'; logActivity(t, `Uploaded acknowledgement evidence ${file.name} (${Math.max(1,Math.round(file.size/1024))} KB, kept in browser)`); render(); toast(`${h(file.name)} attached (simulated storage).`); };
ACT.fevsubmit = el => { const t = taskById(el.dataset.id); t.filing.evidence = 'Under verification'; logActivity(t, 'Evidence submitted for verification'); pushInApp(t.reviewer, t, 'Evidence verification', `Verify the acknowledgement for ${t.title}.`); render(); toast('Sent to a partner for verification.'); };
ACT.fevverify = el => { const t = taskById(el.dataset.id); confirmBox('Verify evidence', `Confirm that <b>${h(t.filing.evidenceFile)}</b> shows acknowledgement <b class="mono">${h(t.filing.ack)}</b> for ${h(t.title)}. The task will be completed.`, 'Verify and complete', () => { t.filing.evidence = 'Verified'; t.status = 'Completed'; logActivity(t, 'Acknowledgement evidence verified; task completed'); render(); toast(`${t.no} completed.`); }); };
ACT.fevreject = el => { const t = taskById(el.dataset.id); openModal('Reject evidence', fld('Reason', `<textarea class="inp" id="evr" placeholder="e.g. Acknowledgement number on the file does not match"></textarea>`, true), `<button class="btn" data-act="closemodal">Cancel</button><button class="btn danger" data-act="fevreject2" data-id="${t.id}">Reject</button>`); };
ACT.fevreject2 = el => { const v = document.getElementById('evr').value.trim(); if (!v) { document.getElementById('evr').classList.add('err'); return toast('Give a reason so the preparer can fix it.', 'warn'); } const t = taskById(el.dataset.id); t.filing.evidence = 'Awaiting upload'; t.filing.evRejected = v; logActivity(t, 'Evidence rejected: '+v); closeModal(); render(); };

/* ===== Documents ===== */
function docTable(ds, compact){
  if (!ds.length) return empty('No documents here', 'Requests you create appear in this list.');
  return `<div class="tw"><table class="t"><thead><tr><th>Document</th>${compact?'':'<th>Client</th>'}<th>FY</th><th>Related task</th><th>Status</th><th>Requested</th><th>Uploaded</th><th>Reviewer comments</th><th></th></tr></thead><tbody>
  ${ds.map(x => { const t = taskById(x.taskId); return `<tr><td><div class="strong">${h(x.name)}</div>${x.file?`<div class="sub mono">${h(x.file)}${x.sim?' · simulated upload':''}</div>`:''}</td>${compact?'':`<td>${h(clientById(x.clientId).name)}</td>`}<td class="num">${h(x.fy)}</td>
    <td>${t?`<button class="btn sm ghost" data-act="opentask" data-id="${t.id}"><span class="mono">${t.no}</span> ${h(t.form)}</button>`:'—'}</td><td>${pill(x.status)}</td><td class="num">${fmtDs(x.requestedOn)}</td><td class="num">${x.uploadedOn?fmtDs(x.uploadedOn):'—'}</td>
    <td class="small" style="max-width:220px">${h(x.comment||'')}</td><td><div class="row" style="flex-wrap:nowrap">
    ${['Requested','Missing','Rejected'].includes(x.status) && can('doc.upload') ? `<button class="btn sm" data-act="upload" data-id="${x.id}">${I('upload')}Upload</button>`:''}
    ${['Requested','Missing'].includes(x.status) && can('doc.request') ? `<button class="btn sm ghost" data-act="remind" data-id="${x.id}">Remind</button>`:''}
    ${x.status==='Awaiting Review' && can('doc.review') ? `<button class="btn sm" data-act="docok" data-id="${x.id}">Accept</button><button class="btn sm ghost" data-act="docrej" data-id="${x.id}">Reject</button>`:''}</div></td></tr>`; }).join('')}</tbody></table></div>`; }
PAGES.documents = () => {
  const f = F('documents', {status:'', q:'', client:''}); const all = vDocs(); const q = f.q.toLowerCase();
  const tabs = [['','All'],['pending','Pending'],['Requested','Requested'],['Missing','Missing'],['Awaiting Review','Awaiting review'],['Rejected','Rejected'],['Received','Received']];
  const match = (x, s) => !s || (s==='pending' ? ['Requested','Missing','Awaiting Review'].includes(x.status) : x.status===s);
  const ds = all.filter(x => match(x, f.status) && (!f.client||x.clientId===f.client) && (!q || (x.name+' '+clientById(x.clientId).name+' '+x.file).toLowerCase().includes(q))).sort((a,b)=> (b.requestedOn>a.requestedOn?1:-1));
  const recvd = all.filter(x=>x.status==='Received').length;
  return `<div class="ph"><div><h1>${S.role==='client'?'Your documents':'Client document workspace'}</h1><div class="sub">${all.length} documents · collection ${all.length?Math.round(100*recvd/all.length):0}% complete</div></div>
    ${can('doc.request')?`<button class="btn pri" data-act="reqdoc">${I('plus')}New document request</button>`:''}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="${f.status===k?'on':''}" data-act="dtab" data-s="${k}">${l}<span class="cnt">${all.filter(x=>match(x,k)).length}</span></button>`).join('')}</div>
  <div class="filters"><input class="inp q" id="dc-q" placeholder="Search documents" value="${h(f.q)}" data-fq="documents.q" aria-label="Search documents">${S.role!=='client'?`<select class="inp" id="dc-client" data-f="documents.client" aria-label="Client">${clientOpts(f.client,'All clients')}</select>`:''}<span class="tiny muted">${ds.length} shown</span></div>
  <div class="card">${docTable(ds)}</div>`;
};
ACT.dtab = el => { S.f.documents.status = el.dataset.s; render(); };
ACT.upload = el => { const x = D().docs.find(d=>d.id===el.dataset.id);
  openModal('Upload: '+x.name, `<div class="note">${I('info')}<div>Simulated upload. The file is read in your browser and its name is recorded; it is not stored on a server.</div></div>
    <label class="dz" for="up-file" style="display:block;cursor:pointer" id="up-dz">${I('upload')}<div style="margin-top:6px"><b>Choose a file</b> or drop it here</div><div class="tiny">PDF, XLSX, CSV, JPG or PNG · up to 10 MB</div></label>
    <input type="file" id="up-file" hidden accept=".pdf,.xlsx,.xls,.csv,.jpg,.jpeg,.png"><div id="up-info" class="small" style="margin-top:8px"></div>`,
    `<button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" id="up-go" data-act="upload2" data-id="${x.id}" disabled>Upload</button>`);
  const inp = document.getElementById('up-file'), dz = document.getElementById('up-dz');
  const pickF = file => { if (!file) return; if (file.size > 10*1024*1024) { document.getElementById('up-info').innerHTML = '<span style="color:var(--bad)">File is over 10 MB. Choose a smaller file.</span>'; return; } UP_FILE = file; document.getElementById('up-info').innerHTML = `${I('file')} <span class="mono">${h(file.name)}</span> · ${Math.max(1,Math.round(file.size/1024))} KB`; document.getElementById('up-go').disabled = false; };
  inp.addEventListener('change', () => pickF(inp.files[0]));
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = 'var(--accent)'; }); dz.addEventListener('dragleave', () => dz.style.borderColor = '');
  dz.addEventListener('drop', e => { e.preventDefault(); dz.style.borderColor = ''; pickF(e.dataTransfer.files[0]); }); };
let UP_FILE = null;
ACT.upload2 = el => { const x = D().docs.find(d=>d.id===el.dataset.id); el.disabled = true; el.innerHTML = '<span class="spin"></span> Uploading…';
  setTimeout(() => { x.file = UP_FILE.name; x.sim = true; x.status = 'Awaiting Review'; x.uploadedOn = TODAY_S; x.comment = ''; const t = taskById(x.taskId); if (t) { logActivity(t, `${S.role==='client'?'Client':'Team'} uploaded ${x.name} (simulated)`, S.role==='client'?'system':undefined); if (t.blocked) t.blocked=''; pushInApp(t.preparer, t, 'Document received', `${clientById(x.clientId).name} uploaded ${x.name}.`); }
    closeModal(); render(); toast(`${h(UP_FILE.name)} uploaded (simulated). Waiting for review.`); }, 700); };
ACT.docok = el => { const x = D().docs.find(d=>d.id===el.dataset.id); x.status = 'Received'; x.by = me().id; x.comment = ''; const t = taskById(x.taskId); if (t) logActivity(t, 'Accepted document '+x.name); render(); toast('Document accepted.'); };
ACT.docrej = el => { openModal('Reject document', fld('Comment for the client', `<textarea class="inp" id="dr-c" placeholder="What is wrong and what to send instead"></textarea>`, true), `<button class="btn" data-act="closemodal">Cancel</button><button class="btn danger" data-act="docrej2" data-id="${el.dataset.id}">Reject and notify</button>`); };
ACT.docrej2 = el => { const v = document.getElementById('dr-c').value.trim(); if (!v) { document.getElementById('dr-c').classList.add('err'); return toast('Add a comment so the client knows what to fix.', 'warn'); }
  const x = D().docs.find(d=>d.id===el.dataset.id); x.status = 'Rejected'; x.comment = v; const c = clientById(x.clientId); queueMsg('Email', c, 'Document rejected', 'doc_request', `Dear ${c.contact},\n\nWe could not use ${x.name}: ${v}\nPlease upload a corrected copy.\n\nRegards,\n${D().cfg.name}`, x.taskId);
  closeModal(); render(); toast('Rejected. Email to client simulated in the communication centre.', 'sim'); };
ACT.remind = el => { const x = D().docs.find(d=>d.id===el.dataset.id); const c = clientById(x.clientId); const wa = D().integrations.find(i=>i.id==='wa').state;
  queueMsg('Email', c, 'Document reminder', 'doc_request', `Dear ${c.contact},\n\nReminder: we are still waiting for ${x.name}.\n\nRegards,\n${D().cfg.name}`, x.taskId);
  queueMsg('WhatsApp', c, 'Document reminder', 'doc_request', `Reminder from ${D().cfg.short}: please share ${x.name}.`, x.taskId, wa==='Sandbox'?'Simulated':'Queued');
  render(); toast(`Reminder simulated by email. WhatsApp ${wa==='Sandbox'?'simulated':'queued: provider not configured'}.`, 'sim'); };

ACT.reqdoc = el => { const cid = el.dataset.client || ''; const tid = el.dataset.task || '';
  openModal('New document request', `<form id="freq" class="fg" novalidate>
    ${fld('Client', `<select class="inp" name="client" id="rq-client" data-req>${clientOpts(cid,'Select client…')}</select>`, true)}
    ${fld('Related task', `<select class="inp" name="task" id="rq-task" data-req>${reqTaskOpts(cid, tid)}</select>`, true)}
    <div class="fld full"><label>Documents <span class="req">*</span></label><div id="rq-docs" class="chks" data-reqgroup>${reqDocChecks(tid)}</div></div>
    ${fld('Additional document', `<input class="inp" name="extra" id="rq-extra" placeholder="Optional, e.g. Loan sanction letter">`, false, true)}
    <div class="fld full"><label>Send through</label><div class="chks"><label class="chk"><input type="checkbox" name="ch" data-multi="1" value="Email" id="rq-em" checked>Email (sandbox)</label><label class="chk"><input type="checkbox" name="ch" data-multi="1" value="WhatsApp" id="rq-wa">WhatsApp (${h(D().integrations.find(i=>i.id==='wa').state.toLowerCase())})</label><label class="chk"><input type="checkbox" name="ch" data-multi="1" value="Portal" id="rq-pt" checked>Client portal</label></div></div>
  </form>`, `<button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" data-act="reqdoc2">Create request</button>`, true); };
function reqTaskOpts(cid, tid){ return opt(D().tasks.filter(t=>t.clientId===cid && isOpen(t)).map(t=>[t.id, t.no+' · '+t.title]), tid, cid?'Select task…':'Select a client first'); }
function reqDocChecks(tid){ const t = taskById(tid); if (!t) return '<span class="small muted">Pick a task to see its required documents.</span>'; return t.docs.map((d,i)=>`<label class="chk"><input type="checkbox" name="docs" data-multi="1" value="${h(d)}" id="rq-d${i}" ${D().docs.some(x=>x.taskId===t.id&&x.name===d&&x.status==='Received')?'':'checked'}>${h(d)}</label>`).join(''); }
document.addEventListener('change', e => { if (e.target.id==='rq-client') { document.getElementById('rq-task').innerHTML = reqTaskOpts(e.target.value, ''); document.getElementById('rq-docs').innerHTML = reqDocChecks(''); }
  if (e.target.id==='rq-task') document.getElementById('rq-docs').innerHTML = reqDocChecks(e.target.value); });
ACT.reqdoc2 = () => { const root = document.getElementById('freq'); const extra = document.getElementById('rq-extra').value.trim();
  if (extra) { const g = document.getElementById('rq-docs'); g.insertAdjacentHTML('beforeend', `<input type="checkbox" name="docs" data-multi="1" value="${h(extra)}" checked hidden>`); }
  const o = readForm(root); if (!o) return toast('Pick a client, task and at least one document.', 'warn'); if (!o.ch.length) return toast('Choose at least one channel.', 'warn');
  const d = D(), c = clientById(o.client), t = taskById(o.task); const wa = d.integrations.find(i=>i.id==='wa').state;
  o.docs.forEach(n => { if (!t.docs.includes(n)) t.docs.push(n); const ex = d.docs.find(x=>x.taskId===t.id && x.name===n);
    if (ex) { ex.status = 'Requested'; ex.requestedOn = TODAY_S; } else d.docs.unshift({id:d.cfg.id+'-d'+(d.seq.d++), clientId:c.id, taskId:t.id, name:n, fy:t.fy, status:'Requested', requestedOn:TODAY_S, uploadedOn:'', comment:'', file:'', by:''}); });
  const body = `Dear ${c.contact},\n\nTo complete ${t.title}, please share:\n${o.docs.map(x=>'• '+x).join('\n')}\n\nYou can upload them through the CAFlow client portal.\n\nRegards,\n${d.cfg.name}`;
  if (o.ch.includes('Email')) queueMsg('Email', c, 'Document request', 'doc_request', body, t.id);
  if (o.ch.includes('WhatsApp')) queueMsg('WhatsApp', c, 'Document request', 'doc_request', `${d.cfg.short}: please share ${o.docs.join(', ')} for ${t.title}.`, t.id, wa==='Sandbox'?'Simulated':'Queued');
  if (t.status==='Scheduled') { t.status = 'Documents Requested'; } logActivity(t, `Requested ${o.docs.length} document(s) via ${o.ch.join(', ')}`);
  closeModal(); render(); toast(`${o.docs.length} document request(s) created for ${h(c.name)}. Messages simulated in Notifications.`, 'sim'); };

/* ===== Notices & assessments ===== */
PAGES.notices = () => { const f = F('notices', {status:'', auth:''}); const ns = D().notices.filter(n=>(!f.status||n.status===f.status)&&(!f.auth||n.authority===f.auth)).sort((a,b)=>a.responseDue<b.responseDue?-1:1);

  const docs = vDocs().filter(x=>{ const t = taskById(x.taskId); return t && inScope(t); }); const recv = docs.filter(x=>x.status==='Received').length;
  const docByStatus = ['Received','Awaiting Review','Requested','Missing','Rejected'].map(s=>({label:s, value:docs.filter(x=>x.status===s).length, cls:s==='Received'?'ok':s==='Missing'||s==='Rejected'?'bad':'warn'}));
  const health = vClients().filter(c=>!f.partner||c.partner===f.partner).map(c=>{ const ts = d.tasks.filter(t=>t.clientId===c.id && (!f.cat||t.cat===f.cat)); const done = ts.filter(t=>!isOpen(t)).length; const od = ts.filter(isOverdue).length; const cd = d.docs.filter(x=>x.clientId===c.id); const dp = cd.length ? Math.round(100*cd.filter(x=>x.status==='Received').length/cd.length) : 100;
    const score = Math.max(0, Math.round(100 - od*18 - ts.filter(t=>isOpen(t)&&riskOf(t)==='High').length*10 - (100-dp)*0.3)); return {c, n:ts.length, done, od, dp, score}; }).sort((a,b)=>a.score-b.score);

  const wl = d.staff.map(s=>{ const l = staffLoad(s); return {label:s.name, value:Math.round(l.util*100), max:100, text:Math.round(l.util*100)+'%', cls:l.util>0.9?'bad':l.util>0.7?'warn':'ok'}; });

    ${f.cat||f.partner?`<button class="btn sm ghost" data-act="clearf" data-page="reports">Clear filters</button>`:''}</div>
  <div class="grid g2" style="margin-bottom:14px">${card('Compliance completion by month', compl, 'monthly', 'Apr–Sep from the historical demo summary (not filtered); Oct from live tasks.')}${card('Filing status by compliance category', fsc, 'filingcat')}</div>
  <div class="grid g3" style="margin-bottom:14px">${card('Overdue tasks by team member', hbars(odBy), 'overdue')}${card('Document collection', `<div class="row" style="margin-bottom:8px"><span class="mono" style="font-size:22px">${docs.length?Math.round(100*recv/docs.length):0}%</span><span class="small muted">${recv} of ${docs.length} received</span></div>${hbars(docByStatus)}`, 'docs')}${card('Staff workload', hbars(wl), 'workload')}</div>
  <div class="grid g-dash">${card('Client-wise compliance health', `<div class="tw"><table class="t"><thead><tr><th>Client</th><th class="r">Obligations</th><th class="r">Done</th><th class="r">Overdue</th><th class="r">Docs in</th><th>Health</th></tr></thead><tbody>${health.map(x=>`<tr class="click" data-act="openclient" data-id="${x.c.id}"><td>${h(x.c.name)}</td><td class="r num">${x.n}</td><td class="r num">${x.done}</td><td class="r num" style="${x.od?'color:var(--bad)':''}">${x.od}</td><td class="r num">${x.dp}%</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar ${x.score<60?'bad':x.score<80?'warn':'ok'}" style="width:80px"><span style="width:${x.score}%"></span></div><span class="num tiny">${x.score}</span></div></td></tr>`).join('')}</tbody></table></div>`, 'health', 'Health score: 100 minus penalties for overdue work, high-risk items and missing documents.')}
    ${card('Outstanding fees', fees.length?hbars(fees.slice(0,10).map(x=>({label:x.c.name, value:x.amt, text:inrK(x.amt), cls:x.od?'bad':'warn'}))):empty('Nothing outstanding','All invoices are paid.'), 'fees', `Total ${inr(fees.reduce((a,x)=>a+x.amt,0))} incl. GST · red bars include overdue invoices.`)}</div>`; };
ACT.rcsv = el => { const d = D(), r = el.dataset.r, f = S.f.reports||{}; const inScope = t => (!f.cat||t.cat===f.cat) && (!f.partner || clientById(t.clientId).partner===f.partner); const T = vTasks().filter(inScope);
