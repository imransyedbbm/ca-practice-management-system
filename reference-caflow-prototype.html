ACT.intsandbox = el => { const x = D().integrations.find(i=>i.id===el.dataset.id); x.state = 'Sandbox'; if (x.id==='wa') x.caps = ['Template messages (sandbox)']; render(); toast(`${h(x.name)} set to Sandbox. It still cannot reach real recipients.`, 'sim'); };
ACT.intoff = el => { const x = D().integrations.find(i=>i.id===el.dataset.id); x.state = 'Not Configured'; render(); toast(`${h(x.name)} disconnected.`); };
ACT.intinfo = el => { const x = D().integrations.find(i=>i.id===el.dataset.id); const req = {email:['Verified sending domain (SPF, DKIM, DMARC)','API key stored in a server-side secret manager','Bounce and complaint webhooks'], wa:['Meta Business verification','Registered WhatsApp number via a BSP','Pre-approved message templates','Client opt-in records'], gsp:['Contract with a licensed GSP','Taxpayer consent and OTP/EVC flow per filing','Sandbox certification before production'], itd:['ERI registration with the Income Tax Department','Taxpayer authorisation and e-verification','Production API keys'], mca:['No public submission API; filings remain assisted on the MCA V3 portal','DSC of director or professional'], cal:['OAuth consent for Google Workspace or Microsoft 365','Per-user calendar selection'], store:['S3-compatible bucket in an Indian region','Encryption at rest and signed URLs','Retention policy aligned to record-keeping rules']}[x.id];
  openModal(x.name+' requirements', `<p class="small" style="margin-top:0">Status: ${pill(x.state)}</p><ul class="small">${req.map(r=>`<li>${h(r)}</li>`).join('')}</ul><p class="tiny muted">CAFlow will never show an integration as Connected until credentials are verified by the server.</p>`, `<button class="btn pri" data-act="closemodal">Close</button>`); };

/* ===== Settings ===== */
PAGES.settings = () => { const f = F('settings', {tab: S.role==='partner'?'firm':'notif'}); const d = D(); const ed = can('*');
  const tabs = [['firm','Firm profile',1],['perm','Team permissions',1],['notif','Notification preferences',0],['esc','Escalation policies',1],['plan','Subscription',1]].filter(t=>ed||!t[2]);
  const st = d.settings || (d.settings = {notif:{email:true, wa:false, inapp:true, digest:true, clientCopy:true}, esc:{remind:3, escalate:1, partner:3, critical:true}, gstin: d.cfg.state+'AAAFR'+'0000'+'Z1Z5'});
  let body = '';
  if (f.tab==='firm') body = `<form id="ffirm" class="fg card card-b" novalidate style="padding:16px">${fld('Firm name', `<input class="inp" name="name" id="sf-name" data-req value="${h(d.cfg.name)}">`, true, true)}${fld('City', `<input class="inp" name="city" id="sf-city" data-req value="${h(d.cfg.city)}">`, true)}${fld('Short code', `<input class="inp mono" name="short" id="sf-short" data-req maxlength="4" value="${h(d.cfg.short)}">`, true)}${fld('ICAI firm registration no.', `<input class="inp mono" id="sf-frn" value="DEMO-${h(d.cfg.short)}-001" disabled>`)}${fld('Firm GSTIN', `<input class="inp mono" id="sf-gst" value="Fictional · not set" disabled>`)}<div class="full row" style="justify-content:flex-end"><button class="btn pri" data-act="savefirm">Save profile</button></div></form>`;
  if (f.tab==='perm') { const perms = [['View all clients','✓','✓',''],['Create and edit tasks','✓','✓',''],['Reassign work','✓','',''],['Record filing submissions','✓','✓',''],['Verify filing evidence','✓','',''],['Upload documents','✓','✓','✓'],['Send client messages','✓','✓',''],['Billing and fees','✓','','Own invoices'],['Approve compliance rules','✓','',''],['Manage integrations and settings','✓','','']];
    body = `<div class="note warn">${I('alert')}<div>This matrix describes the demo role views. Real enforcement happens on the server per request and per tenant.</div></div><div class="card"><div class="tw"><table class="t"><thead><tr><th>Permission</th><th>Managing Partner</th><th>Accountant</th><th>Client user</th></tr></thead><tbody>${perms.map(p=>`<tr><td>${h(p[0])}</td>${p.slice(1).map(v=>`<td>${v==='✓'?'<span class="pill ok nodot">Allowed</span>':v?`<span class="pill info nodot">${h(v)}</span>`:'<span class="faint">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; }
  if (f.tab==='notif') body = `<div class="card"><div class="list">${[['email','Email notifications','Deadline reminders and review requests by email'],['wa','WhatsApp alerts','Urgent escalations on WhatsApp (needs WhatsApp integration)'],['inapp','In-app alerts','Bell notifications inside CAFlow'],['digest','Daily digest','08:00 summary of due, overdue and review items'],['clientCopy','Copy me on client requests','Receive a copy of document requests sent to my clients']].map(([k,l,x])=>`<div class="li"><div class="main-t"><div class="ttl">${l}</div><div class="tiny muted">${x}</div></div><label class="switch"><input type="checkbox" id="np-${k}" ${st.notif[k]?'checked':''} data-act-change="notifpref" data-k="${k}" aria-label="${l}"><span></span></label></div>`).join('')}</div></div>`;
  if (f.tab==='esc') body = `<form id="fesc" class="fg card card-b" novalidate style="padding:16px">${fld('Remind preparer (days before internal due)', `<input class="inp" type="number" min="1" max="30" name="remind" id="es-r" data-req value="${st.esc.remind}">`, true)}${fld('Escalate to reviewer (days after internal due)', `<input class="inp" type="number" min="0" max="30" name="escalate" id="es-e" data-req value="${st.esc.escalate}">`, true)}${fld('Escalate to partner (days before statutory date)', `<input class="inp" type="number" min="0" max="30" name="partner" id="es-p" data-req value="${st.esc.partner}">`, true)}<label class="chk"><input type="checkbox" name="critical" id="es-c" ${st.esc.critical?'checked':''}>Set priority to Critical on escalation</label><div class="full tiny muted">Policies feed the automation rules. In this prototype they apply when you preview a rule run.</div><div class="full row" style="justify-content:flex-end"><button class="btn pri" data-act="saveesc">Save policies</button></div></form>`;
  if (f.tab==='plan') body = `<div class="grid g3">${[['Starter','₹2,499','per user / month','Up to 5 users, 50 clients'],['Professional','₹3,999','per user / month','Up to 25 users, unlimited clients, automation'],['Enterprise','Custom','annual contract','SSO, data residency, dedicated support']].map(([n,p,u,x],i)=>`<div class="card"><div class="card-b"><div class="row"><b class="grow">${n}</b>${i===1?'<span class="pill info nodot">Current plan</span>':''}</div><div class="mono" style="font-size:22px;margin:6px 0 0">${p}</div><div class="tiny muted">${u} · illustrative pricing</div><p class="small">${x}</p><button class="btn sm" ${i===1?'disabled':''} data-act="planchg">${i===1?'Current':'Request change'}</button></div></div>`).join('')}</div><p class="small muted">Seats in use: ${d.staff.length} of 25.</p>`;
  return `<div class="ph"><div><h1>Settings</h1><div class="sub">${h(d.cfg.name)}</div></div>${ed?`<button class="btn danger" data-act="resetdemo">Reset demo data</button>`:''}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="${f.tab===k?'on':''}" data-act="stab" data-t="${k}">${l}</button>`).join('')}</div>${body}`; };
ACT.stab = el => { S.f.settings.tab = el.dataset.t; render(); };
ACT.savefirm = () => { const o = readForm(document.getElementById('ffirm')); if (!o) return toast('Firm name, city and short code are required.', 'warn'); Object.assign(D().cfg, {name:o.name, city:o.city, short:o.short.toUpperCase()}); render(); toast('Firm profile saved for this session.'); };
CHG.notifpref = el => { D().settings.notif[el.dataset.k] = el.checked; if (el.dataset.k==='wa' && el.checked && D().integrations.find(i=>i.id==='wa').state==='Not Configured') toast('Saved. WhatsApp alerts stay queued until the WhatsApp integration is configured.', 'warn'); else toast('Preference saved.'); };
ACT.saveesc = () => { const o = readForm(document.getElementById('fesc')); if (!o) return; const st = D().settings.esc; Object.assign(st, {remind:+o.remind, escalate:+o.escalate, partner:+o.partner, critical:o.critical}); const r3 = D().rules.find(r=>r.id==='r3'); r3.days = st.remind; render(); toast('Escalation policies saved. Preparer reminder rule now uses '+st.remind+' days.'); };
ACT.planchg = () => toast('Plan changes go through your account manager. Nothing was charged.', 'sim');
ACT.resetdemo = () => confirmBox('Reset demo data', 'This restores all three fictional firms to their original demo state and discards changes made in this tab.', 'Reset everything', () => { initData(); S.f = {}; S.drawer = null; S.clientUser = D().clients[0].id; go('dashboard'); toast('Demo data reset.'); }, true);

/* ===== Boot ===== */
try { const th = localStorage.getItem('caflow-theme'); if (th) document.documentElement.dataset.theme = th; } catch(_) {}
S.clientUser = D().clients[0].id;
render();
</script>
